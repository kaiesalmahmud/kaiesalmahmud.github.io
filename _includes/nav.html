<header class="site-header">
  <a class="skip" href="#main">Skip to content</a>
  <div class="wrap bar">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <ul>
        {% assign items = "Research|/research/,Projects|/projects/,Publications|/publications/,Gallery|/gallery/,CV|/cv/" | split: "," %}
        {% for item in items %}
          {% assign parts = item | split: "|" %}
          <li><a href="{{ parts[1] | relative_url }}"{% if page.url contains parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
